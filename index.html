<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0f1c" />

    <title>URLProbe Studio: Inspect. Analyze. Understand.</title>
    <meta
      name="description"
      content="Inspect, analyze and understand URLs with a growing collection of developer-focused tools."
    />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!--
      Open Graph (Facebook, LinkedIn, Slack, Discord, WhatsApp...)
      Crawlers need ABSOLUTE URLs, so the site address comes from the
      VITE_SITE_URL environment variable (for example https://studio.example.com,
      no trailing slash). Set it in .env and in your host's build settings.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="URLProbe Studio" />
    <meta property="og:title" content="URLProbe Studio: Inspect. Analyze. Understand." />
    <meta
      property="og:description"
      content="Inspect, analyze and understand URLs with a growing collection of developer-focused tools."
    />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:image" content="%VITE_SITE_URL%/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="URLProbe Studio: Your URL intelligence toolkit. Inspect. Analyze. Understand."
    />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="URLProbe Studio: Inspect. Analyze. Understand." />
    <meta
      name="twitter:description"
      content="Inspect, analyze and understand URLs with a growing collection of developer-focused tools."
    />
    <meta name="twitter:image" content="%VITE_SITE_URL%/og-image.png" />
    <meta
      name="twitter:image:alt"
      content="URLProbe Studio: Your URL intelligence toolkit. Inspect. Analyze. Understand."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
